<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BTC 헤지 포지션 청산가 계산기</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
  <style>
    :root{color-scheme:dark;--bg:#090d14;--panel:#111827;--line:#263247;--text:#f8fafc;--muted:#94a3b8;--green:#2dd4bf;--red:#fb7185;--blue:#60a5fa;--amber:#fbbf24}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -20%,#1e293b 0,var(--bg) 42%);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Pretendard","Noto Sans KR",sans-serif}
    main{width:min(1180px,calc(100% - 28px));margin:0 auto;padding:30px 0 56px}h2{margin:0 0 14px;font-size:20px}p{margin:6px 0;color:var(--muted)}
    .top{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:10px}.privacy{font-size:12px;text-align:right}.panel{background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 18px 60px #0004}.upload{display:grid;grid-template-columns:1fr 120px;gap:8px;align-items:center}.drop{display:grid;place-items:center;min-height:76px;border:1px dashed #475569;border-radius:12px;cursor:pointer;text-align:center;padding:8px;background:#0b1220}.drop:hover,.drop.drag{border-color:var(--blue);background:#111d31}.drop strong{font-size:15px}.drop input{position:absolute;opacity:0;pointer-events:none}.preview{width:100%;height:76px;object-fit:contain;background:#05070b;border-radius:10px}.status{margin-top:6px;color:var(--blue)}.status:empty{display:none}
    .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.metric{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#0b1220}.metric span{display:block;color:var(--muted);font-size:12px}.metric b{display:block;margin-top:3px;font-size:17px}.long{color:var(--green)}.short{color:var(--red)}.warn{color:var(--amber)}
    .results{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.wide{grid-column:1/-1}.legend{display:flex;gap:18px;flex-wrap:wrap;margin:-6px 0 12px;color:var(--muted);font-size:12px}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:13px}table{width:100%;border-collapse:collapse;min-width:560px}th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th{position:sticky;top:0;background:#172033;color:#cbd5e1;font-size:12px}th:first-child,td:first-child{text-align:center}.split th:nth-child(4),.split td:nth-child(4){border-left:2px solid #475569}tr:last-child td{border-bottom:0}td strong{font-variant-numeric:tabular-nums;font-size:15px}td small{display:block;color:var(--muted);margin-top:2px}.near{background:#451a1a66}.safe{background:#052e2b44}
    .custom{display:grid;grid-template-columns:190px 150px 1fr 1fr;gap:12px;align-items:end}.field label{display:block;color:var(--muted);font-size:12px;margin:0 0 5px}.field input,.field select{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;background:#0b1220;color:var(--text);padding:0 11px;font:inherit}.answer{min-height:70px;border:1px solid var(--line);border-radius:12px;padding:10px 13px;background:#0b1220}.answer span{color:var(--muted);font-size:12px}.answer b{display:block;margin-top:3px;font-size:19px}
    details{margin-top:16px}summary{cursor:pointer;color:#cbd5e1}.inputs{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:12px}.raw{width:100%;height:100px;margin-top:10px;border:1px solid var(--line);border-radius:10px;background:#05070b;color:#94a3b8;padding:10px;resize:vertical}.error{color:var(--red)}
    @media(max-width:860px){.top{display:block}.privacy{text-align:left}.results{grid-template-columns:1fr}.wide{grid-column:auto}.summary{grid-template-columns:1fr 1fr}.custom{grid-template-columns:1fr 1fr}.answer{grid-column:span 1}.inputs{grid-template-columns:1fr 1fr}.upload{grid-template-columns:1fr}.preview{height:180px}}
    @media(max-width:520px){main{width:min(100% - 6px,1180px);padding:3px 0 20px}.top{display:none}.panel{padding:6px;border-radius:10px}.upload{grid-template-columns:1fr}.drop{min-height:42px;padding:3px}.drop strong{font-size:12px}.drop small{font-size:8px}.preview{display:none}.status{min-height:14px;margin-top:2px;font-size:9px}.panel>p{margin:1px 0;font-size:8px}.summary{grid-template-columns:1fr 1fr;gap:4px;margin:5px 0}.metric{padding:6px 7px}.metric span{font-size:9px}.metric b{overflow:hidden;font-size:11px;white-space:nowrap}.results{gap:6px;margin-top:6px}.results .panel{padding:6px}h2{margin-bottom:5px;font-size:14px}.custom,.inputs{grid-template-columns:1fr}.answer{grid-column:auto}.privacy{display:none}.table-wrap{overflow:visible;border-radius:7px}table{min-width:0;table-layout:fixed;font-size:8px}th,td{overflow:hidden;padding:4px 1px;white-space:nowrap;line-height:1.05;text-overflow:clip}th{font-size:7px}th:first-child{width:12%}td strong{font-size:9px}td small{display:none}.legend{gap:5px;margin:-2px 0 4px;font-size:8px}.legend i{width:6px;height:6px;margin-right:3px}}
  </style>
</head>
<body>
<main>
  <header class="top">
    <p>MEXC 통합 캡처로 정리·추가진입 시나리오를 계산합니다.</p>
    <p class="privacy">이미지는 이 브라우저 안에서만 OCR 처리되며 업로드되지 않습니다.</p>
  </header>

  <section class="panel">
    <div class="upload">
      <label class="drop" for="positionShot"><span><strong>통합 화면 넣기</strong><br><small>총자산+롱·숏이 보이는 캡처 한 장</small></span><input id="positionShot" type="file" accept="image/*"></label>
      <img id="preview" class="preview" alt="선택한 캡처 미리보기">
    </div>
    <div id="status" class="status"></div>
    <div id="summary" class="summary" hidden></div>

    <details id="edit">
      <summary>인식값 확인·수정</summary>
      <div class="inputs">
        <div class="field"><label for="mark">현재 마크가</label><input id="mark" inputmode="decimal"></div>
        <div class="field"><label for="ratio">화면의 마진 비율 (%)</label><input id="ratio" inputmode="decimal"></div>
        <div class="field"><label for="walletBalance">지갑 잔액 (USDT)</label><input id="walletBalance" inputmode="decimal"></div>
        <div class="field"><label for="walletPnl">계정 미실현 PNL</label><input id="walletPnl" inputmode="decimal"></div>
        <div class="field"><label for="orderMargin">미체결 주문 증거금</label><input id="orderMargin" value="0" inputmode="decimal"></div>
        <div class="field"><label for="shortEntry">숏 진입가</label><input id="shortEntry" inputmode="decimal"></div>
        <div class="field"><label for="shortValue">숏 포지션(USDT)</label><input id="shortValue" inputmode="decimal"></div>
        <div class="field"><label for="shortPnl">숏 미실현 PNL</label><input id="shortPnl" inputmode="decimal"></div>
        <div class="field"><label for="longEntry">롱 진입가</label><input id="longEntry" inputmode="decimal"></div>
        <div class="field"><label for="longValue">롱 포지션(USDT)</label><input id="longValue" inputmode="decimal"></div>
        <div class="field"><label for="longPnl">롱 미실현 PNL</label><input id="longPnl" inputmode="decimal"></div>
        <div class="field"><label for="fee">시장가 수수료 (%)</label><input id="fee" value="0.02" inputmode="decimal"></div>
        <div class="field"><label for="liqFee">강제청산 수수료 (%)</label><input id="liqFee" value="0.04" inputmode="decimal"></div>
        <div class="field"><label for="mmrOverride">MMR 직접 입력 (%)</label><input id="mmrOverride" inputmode="decimal" placeholder="비우면 MEXC 자동"></div>
      </div>
      <textarea id="raw" class="raw" readonly placeholder="OCR 원문"></textarea>
    </details>
  </section>

  <div id="results" class="results" hidden>
    <section class="panel wide">
      <h2>부분 정리</h2>
      <div class="legend"><span><i style="background:var(--green)"></i>숏 정리 → 남은 롱의 하방 청산가</span><span><i style="background:var(--red)"></i>롱 정리 → 남은 숏의 상방 청산가</span></div>
      <div class="table-wrap"><table class="split"><thead><tr><th>정리율</th><th>숏 정리 후</th><th>현재가 거리</th><th>롱 정리 후</th><th>현재가 거리</th></tr></thead><tbody id="closeRows"></tbody></table></div>
    </section>

    <section class="panel wide">
      <h2>현재 포지션 대비 추가 진입</h2>
      <div class="legend"><span><i style="background:var(--red)"></i>숏 추가</span><span><i style="background:var(--green)"></i>롱 추가</span><span>현재가 시장가 진입·수수료 반영</span></div>
      <div class="table-wrap"><table><thead><tr><th>추가율</th><th>숏 추가 후</th><th>현재가 거리</th><th>롱 추가 후</th><th>현재가 거리</th></tr></thead><tbody id="addRows"></tbody></table></div>
    </section>

    <section class="panel wide">
      <h2>증거금 금액으로 추가 진입</h2>
      <div class="custom">
        <div class="field"><label for="marginAmount">레버리지 전 증거금 (USDT)</label><input id="marginAmount" type="number" min="0" step="100" value="1000"></div>
        <div class="field"><label for="leverage">레버리지</label><input id="leverage" type="number" min="1" step="1" value="30"></div>
        <div id="customShort" class="answer"></div><div id="customLong" class="answer"></div>
      </div>
    </section>
  </div>
</main>

<script>
const $=id=>document.getElementById(id), presets=[100,80,70,60,50,40,30,20,10,5];
// BTCUSDT 1계약=0.0001 BTC. 수량별 MEXC 현재 위험 한도.
const tiers=[[0,5,.001],[5,12,.004],[12,32,.005],[32,280,.01],[280,1750,.02],[1750,1850,.05]];
const fieldIds=['mark','ratio','walletBalance','walletPnl','orderMargin','shortEntry','shortValue','shortPnl','longEntry','longValue','longPnl','fee','liqFee','mmrOverride','marginAmount','leverage'];
const num=s=>{const cleaned=String(s??'').replace(/[%,$₩\s]/g,'').replaceAll(',','');return cleaned===''?NaN:Number(cleaned)};
const money=n=>Number.isFinite(n)?n.toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1}):'—';

function maintenanceRate(q,override){if(Number.isFinite(override)&&override>0)return override;return (tiers.find(t=>q<=t[1])||tiers.at(-1))[2]}
function maintenance(q,entry,override){return q*entry*maintenanceRate(q,override)}
function totalMaintenance(s){return maintenance(s.qL,s.eL,s.mmrOverride)+maintenance(s.qS,s.eS,s.mmrOverride)}
function readState(){
  const v=Object.fromEntries(fieldIds.map(id=>[id,$(id).value]));
  for(const k of fieldIds.filter(k=>!['marginAmount','leverage'].includes(k)))v[k]=num(v[k]);
  v.marginAmount=num(v.marginAmount);v.leverage=num(v.leverage);v.ratio/=100;v.fee/=100;v.liqFee/=100;v.mmrOverride/=100;
  if(![v.mark,v.walletBalance,v.shortEntry,v.shortValue,v.shortPnl,v.longEntry,v.longValue,v.longPnl].every(Number.isFinite)||v.mark<=0)return null;
  if(!Number.isFinite(v.orderMargin))v.orderMargin=0;if(!Number.isFinite(v.fee))v.fee=.0002;if(!Number.isFinite(v.liqFee))v.liqFee=.0004;
  v.qS=v.shortValue/v.mark;v.qL=v.longValue/v.mark;
  v.balance=v.walletBalance;
  v.equity=v.walletBalance+(Number.isFinite(v.walletPnl)?v.walletPnl:v.shortPnl+v.longPnl);
  return v;
}
function liquidation(s){
  const net=s.qL-s.qS,mm=totalMaintenance(s),eq=s.balance-s.orderMargin+s.qL*(s.mark-s.eL)+s.qS*(s.eS-s.mark),reserve=s.mark*(s.qL+s.qS)*s.liqFee;
  if(eq<=mm+reserve)return {immediate:true,side:net>=0?'롱':'숏',risk:(mm+reserve)/eq};
  const den=net-s.liqFee*(s.qL+s.qS),numerator=mm-s.balance+s.orderMargin+s.qL*s.eL-s.qS*s.eS;
  if(Math.abs(den)<1e-10)return {price:null,side:'중립',risk:(mm+reserve)/eq};
  const p=numerator/den,adverse=p>0&&(net>0?p<s.mark:p>s.mark);
  return {price:adverse?p:null,side:net>0?'롱':'숏',risk:(mm+reserve)/eq,net};
}
function act(v,type,fraction,margin){
  const s={mark:v.mark,fee:v.fee,liqFee:v.liqFee,mmrOverride:v.mmrOverride,orderMargin:v.orderMargin,balance:v.balance,qL:v.qL,qS:v.qS,eL:v.longEntry,eS:v.shortEntry};
  if(type==='closeShort'){const q=s.qS*fraction;s.balance+=q*(s.eS-s.mark)-q*s.mark*s.fee;s.qS-=q}
  if(type==='closeLong'){const q=s.qL*fraction;s.balance+=q*(s.mark-s.eL)-q*s.mark*s.fee;s.qL-=q}
  if(type==='addShort'){const q=margin!=null?margin*v.leverage/s.mark:s.qS*fraction;s.balance-=q*s.mark*s.fee;s.eS=(s.qS*s.eS+q*s.mark)/(s.qS+q);s.qS+=q}
  if(type==='addLong'){const q=margin!=null?margin*v.leverage/s.mark:s.qL*fraction;s.balance-=q*s.mark*s.fee;s.eL=(s.qL*s.eL+q*s.mark)/(s.qL+q);s.qL+=q}
  return {...liquidation(s),qL:s.qL,qS:s.qS,notional:margin!=null?margin*v.leverage:null};
}
function resultCell(r,mark){
  if(r.immediate)return `<strong class="warn">즉시 청산 위험</strong><small>현재 위험비율 ${money(r.risk*100)}%</small>`;
  if(!r.price)return `<strong>표시 없음</strong><small>현재 구조상 양(+)의 청산가 없음</small>`;
  return `<strong class="${r.side==='롱'?'long':'short'}">${money(r.price)}</strong><small>${r.side} · 순포지션 ${money(Math.abs(r.qL-r.qS))} BTC</small>`;
}
function distanceCell(r,mark){if(!r.price||r.immediate)return '—';const d=Math.abs(r.price-mark)/mark*100;return `<strong>${money(d)}%</strong>`}
function rowClass(a,b,mark){const distances=[a,b].filter(x=>x.price).map(x=>Math.abs(x.price-mark)/mark);return distances.length&&Math.min(...distances)<.02?'near':distances.length&&Math.min(...distances)>.15?'safe':''}
function render(){
  const v=readState();if(!v){$('results').hidden=true;$('summary').hidden=true;return}
  $('results').hidden=false;$('summary').hidden=false;
  const net=v.qL-v.qS;
  const mm=totalMaintenance({qL:v.qL,qS:v.qS,eL:v.longEntry,eS:v.shortEntry,mmrOverride:v.mmrOverride}),longRate=maintenanceRate(v.qL,v.mmrOverride),shortRate=maintenanceRate(v.qS,v.mmrOverride);
  $('summary').innerHTML=`<div class="metric"><span>현재 마크가</span><b>${money(v.mark)}</b></div><div class="metric"><span>지갑 잔액</span><b>${money(v.walletBalance)} USDT</b></div><div class="metric"><span>현재 총 순자산</span><b>${money(v.equity)} USDT</b></div><div class="metric"><span>현재 순포지션</span><b class="${net>=0?'long':'short'}">${net>=0?'롱':'숏'} ${money(Math.abs(net))} BTC</b></div><div class="metric"><span>화면의 마진 비율</span><b>${money(v.ratio*100)}%</b></div><div class="metric"><span>적용 MMR (롱 / 숏)</span><b>${money(longRate*100)}% / ${money(shortRate*100)}%</b></div><div class="metric"><span>교차 유지증거금 합계</span><b>${money(mm)} USDT</b></div><div class="metric"><span>미체결 주문 증거금</span><b>${money(v.orderMargin)} USDT</b></div>`;
  $('closeRows').innerHTML=presets.map(p=>{const a=act(v,'closeShort',p/100),b=act(v,'closeLong',p/100);return `<tr class="${rowClass(a,b,v.mark)}"><td><strong>${p}%</strong></td><td>${resultCell(a,v.mark)}</td><td>${distanceCell(a,v.mark)}</td><td>${resultCell(b,v.mark)}</td><td>${distanceCell(b,v.mark)}</td></tr>`}).join('');
  $('addRows').innerHTML=presets.map(p=>{const a=act(v,'addShort',p/100),b=act(v,'addLong',p/100);return `<tr class="${rowClass(a,b,v.mark)}"><td><strong>+${p}%</strong></td><td>${resultCell(a,v.mark)}</td><td>${distanceCell(a,v.mark)}</td><td>${resultCell(b,v.mark)}</td><td>${distanceCell(b,v.mark)}</td></tr>`}).join('');
  const amount=Math.max(0,v.marginAmount||0),a=act(v,'addShort',0,amount),b=act(v,'addLong',0,amount),note=`증거금 ${money(amount)} × ${money(v.leverage)} = ${money(amount*v.leverage)} USDT`;
  $('customShort').innerHTML=`<span>숏 추가 · ${note}</span>${resultCell(a,v.mark)}`;$('customLong').innerHTML=`<span>롱 추가 · ${note}</span>${resultCell(b,v.mark)}`;
}

function numericTokens(text){return [...text.replace(/\([^)]*\)/g,'').replace(/[−–—]/g,'-').matchAll(/[+\-]?\s*\d[\d,]*(?:\.\d+)?\s*%?/g)].map(m=>({raw:m[0],value:num(m[0]),percent:m[0].includes('%')}));}
function parseCard(text){
  const t=numericTokens(text),perc=t.filter(x=>x.percent),plain=t.filter(x=>!x.percent&&Math.abs(x.value)>1000);
  if(plain.length<5)return null;
  const pnl=plain[0].value,margin=plain[2].value,entry=plain[3].value,mark=plain[4].value,position=/(?:\bCont\b|Contracts?|계약)/i.test(text)?plain[1].value*.0001*mark:plain[1].value;
  let side;if(/(?:숏|short)/i.test(text))side='short';else if(/(?:롱|long)/i.test(text))side='long';else side=pnl*(entry-mark)>=0?'short':'long';
  return {side,pnl,position,margin,entry,mark,ratio:perc.at(-1)?.value};
}
function parseOCR(text){
  let parts=text.split(/BTC\s*USDT/i).slice(1).map(parseCard).filter(Boolean);
  if(parts.length<2){const cards=text.split(/(?=[+\-]\s*\d[\d,]*\.\d{2,})/).map(parseCard).filter(Boolean);parts=cards.slice(0,2)}
  const short=parts.find(x=>x.side==='short'),long=parts.find(x=>x.side==='long');if(!short||!long)throw Error('롱·숏 두 포지션을 구분하지 못했습니다.');
  const mark=(short.mark+long.mark)/2,walletPnl=short.pnl+long.pnl,equity=numericTokens(text.split(/BTC\s*USDT/i)[0]).find(x=>!x.percent&&x.value>=1000)?.value;
  return {mark,ratio:short.ratio||long.ratio,shortEntry:short.entry,shortValue:short.position,shortPnl:short.pnl,longEntry:long.entry,longValue:long.position,longPnl:long.pnl,...(Number.isFinite(equity)?{walletBalance:equity-walletPnl,walletPnl}:{})};
}
async function preprocess(file){
  const img=await createImageBitmap(file),scale=Math.min(3,Math.max(1,1200/img.width)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0,c.width,c.height);const d=x.getImageData(0,0,c.width,c.height);for(let i=0;i<d.data.length;i+=4){let v=255-Math.max(d.data[i],d.data[i+1],d.data[i+2]);v=Math.max(0,Math.min(255,(v-128)*1.5+128));d.data[i]=d.data[i+1]=d.data[i+2]=v}x.putImageData(d,0,0);return c}
async function recognize(file){
  $('status').className='status';$('status').textContent='이미지 선명화 중…';const image=await preprocess(file);
  const r=await Tesseract.recognize(image,'kor+eng',{logger:m=>{if(m.status==='recognizing text')$('status').textContent=`숫자 읽는 중… ${Math.round((m.progress||0)*100)}%`}});return r.data.text;
}
async function loadImage(file){if(!file?.type.startsWith('image/'))return;$('preview').src=URL.createObjectURL(file);try{const text=await recognize(file),values=parseOCR(text);$('raw').value=text;for(const [k,v] of Object.entries(values))$(k).value=v;$('status').textContent='';render()}catch(err){$('status').className='status error';$('status').textContent=`자동 인식 실패: ${err.message} 아래 ‘인식값 확인·수정’에서 숫자를 입력하세요.`;$('edit').open=true}}
$('positionShot').addEventListener('change',async e=>{for(const file of e.target.files)await loadImage(file);e.target.value=''});
document.addEventListener('paste',async e=>{const files=[...(e.clipboardData?.items||[])].filter(item=>item.type.startsWith('image/')).map(item=>item.getAsFile()).filter(Boolean);if(files.length){e.preventDefault();for(const file of files)await loadImage(file)}});
for(const drop of document.querySelectorAll('.drop')){
  for(const event of ['dragenter','dragover'])drop.addEventListener(event,e=>{e.preventDefault();drop.classList.add('drag')});
  for(const event of ['dragleave','drop'])drop.addEventListener(event,async e=>{drop.classList.remove('drag');if(event==='drop'){e.preventDefault();for(const file of e.dataTransfer.files)await loadImage(file)}})
}
fieldIds.forEach(id=>$(id).addEventListener('input',render));
